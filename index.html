<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <script>
      document.documentElement.classList.add('js')
    </script>
    <!-- Cross-page transitions opt in here, inline, so the new page has opted in before its first frame
         (from the bundled CSS the opt-in sometimes arrived too late and Chrome reported an aborted transition). -->
    <style>
      @view-transition {
        navigation: auto;
      }
      @media (prefers-reduced-motion: reduce) {
        @view-transition {
          navigation: none;
        }
      }
    </style>
    <!--app-head-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
