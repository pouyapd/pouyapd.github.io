<!doctype html>
<!-- Social preview template (1200×630). Rendered to og-card.png by `npm run og`;
     `npm run assets` then writes public/og-image.jpg. Uses the bundled fonts and
     the hero image (tools/hero/sunset-portal.png), so the card matches the site.
     The logo is the pd monogram alone (public/brand/logo.svg). -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Geist'; src: url(/node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2) format('woff2'); font-weight: 100 900; }
  @font-face { font-family: 'Instrument'; font-style: italic; src: url(/node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-italic.woff2) format('woff2'); }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #101315; }
  .card { position: relative; width: 1200px; height: 630px; color: #F2F0E9; font-family: Geist, sans-serif; }
  .scene { position: absolute; inset: 0; background: url(/tools/hero/sunset-portal.png) 74% 42% / cover no-repeat; }
  .scrim { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(16,19,21,.72) 0%, rgba(16,19,21,.5) 34%, rgba(16,19,21,0) 56%); }
  .content { position: absolute; left: 72px; top: 64px; bottom: 60px; display: flex; flex-direction: column; justify-content: space-between; }
  .logo { height: 64px; width: auto; align-self: flex-start; }
  h1 { margin: 0; font-weight: 300; font-size: 58px; line-height: 1.02; letter-spacing: -0.04em; }
  h1 em { font-family: Instrument, serif; font-style: italic; font-weight: 400; font-size: 1.1em; letter-spacing: -0.012em; color: #F2F0E9; }
  .meta { display: flex; gap: 18px; align-items: center; font-size: 15px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; color: #A6ADB3; }
  .dot { width: 5px; height: 5px; border-radius: 50%; background: #BDB8AF; }
</style>
</head>
<body>
  <div class="card">
    <div class="scene"></div>
    <div class="scrim"></div>
    <div class="content">
      <img class="logo" src="/brand/logo.svg" alt="">
      <h1>Digital experiences,<br>beyond the <em>ordinary.</em></h1>
      <div class="meta"><span>Websites</span><span class="dot"></span><span>Shops</span><span class="dot"></span><span>Bookings</span></div>
    </div>
  </div>
</body>
</html>
