# Builds the static site and publishes it to GitHub Pages.
#
# One-time setup in the repository: Settings → Pages → Source: "GitHub Actions".
# The site URL (and therefore the base path) comes from the Pages settings:
#   - user site:     https://USERNAME.github.io/   (this repository: https://pouyapd.github.io/)
#   - project site:  https://USERNAME.github.io/REPOSITORY/
#   - custom domain: https://your-domain.com/   (Settings → Pages → Custom domain)
# To force a specific URL, add a repository variable SITE_URL
# (Settings → Secrets and variables → Actions → Variables).
#
# Hardening: no permissions by default, each job gets only what it needs; every action is pinned to
# a full commit SHA (the version is in the comment; .github/dependabot.yml proposes updates);
# checkout does not leave the token in .git/config; npm installs without running package scripts.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # check out the code
      pages: read # configure-pages reads the site URL
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # no dependency needs an install script; skipping them shuts out install-time code from the registry
      - run: npm ci --ignore-scripts

      - name: Lint, build and verify
        run: npm run check
        env:
          SITE_URL: ${{ vars.SITE_URL || format('{0}/', steps.pages.outputs.base_url) }}

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # publish to Pages
      id-token: write # prove the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
