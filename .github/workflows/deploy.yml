# Builds the static site and publishes it to GitHub Pages.
#
# One-time setup in the repository: Settings → Pages → Source: "GitHub Actions".
# The site URL (and therefore the base path) comes from the Pages settings:
#   - project site:  https://USERNAME.github.io/REPOSITORY/
#   - custom domain: https://your-domain.com/   (Settings → Pages → Custom domain)
# To force a specific URL, add a repository variable SITE_URL
# (Settings → Secrets and variables → Actions → Variables).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - name: Lint, build and verify
        run: npm run check
        env:
          SITE_URL: ${{ vars.SITE_URL || format('{0}/', steps.pages.outputs.base_url) }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
